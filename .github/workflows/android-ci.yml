name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify pull request version increment
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_version_increment.py "$BASE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          :app:assembleDebugAndroidTest
          --no-daemon

  managed-device-tests:
    name: Pixel 6 API 35 device tests
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run managed-device tests
        timeout-minutes: 40
        run: >-
          ./gradlew
          :app:pixel6Api35DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --no-daemon

      - name: Verify managed-device tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = list(Path("app/build/outputs/androidTest-results/managedDevice").rglob("TEST-*.xml"))
          executed = sum(
              int(suite.attrib.get("tests", 0)) - int(suite.attrib.get("skipped", 0))
              for suite in (ElementTree.parse(report).getroot() for report in reports)
          )
          if executed < 1:
              raise SystemExit("Managed-device task produced no executed tests")
          print(f"Verified {executed} managed-device tests executed across {len(reports)} report(s)")
          PY

      - name: Upload managed-device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel6-api35-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
